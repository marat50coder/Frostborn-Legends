name: frostborngame
description: "Frostborn Legends — free-to-play social slots with fun coins, bonus wheels and daily rewards."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.9.0

# NOTE on pinning strategy (see the accompanying gray-part pitfalls
# for the rationale — attribution SDK floors, 16 KB page-size support,
# core-library desugaring). Do NOT downgrade the attribution/messaging
# stack: older versions ship the false-Organic bug that misroutes paid
# installs, and pre-15.2 firebase_messaging is not 16 KB-aligned.
dependencies:
  flutter:
    sdk: flutter

  # Game surface — existing dependencies, unchanged.
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0

  # Hearth flow stack.
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.13.0
  connectivity_plus: ^7.1.1
  appsflyer_sdk: ^6.18.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  device_info_plus: 11.4.0
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/game/ui/
    - assets/game/bg/
    - assets/game/symbols/
    - assets/game/items/
    - assets/game/badges/
    - assets/game/chars/
    - assets/game/wheels/
    - assets/game/audio/
    - assets/frost_boot_stage/

# Only the legacy pre-API-26 mipmaps are generated by this tool. The
# adaptive icon in mipmap-anydpi-v26/ic_launcher.xml is hand-written
# so it can share the SAME <adaptive-icon> with the Android 12+
# splash (drawable-anydpi-v26/ic_splash_logo.xml). Do NOT enable
# `adaptive_icon_*` here — flutter_launcher_icons would overwrite
# the hand-written xml on the next run and the icon would revert
# to the default edge-to-edge foreground that the launcher's round
# mask crops.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
