org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
android.builtInKotlin=false
# Kotlin incremental compilation fights us when the project path
# contains a space or the pub cache lives on a different volume
# (Windows). Frostborn's Android CI never benefits from incrementals,
# and the disabled cache costs ~0.6s per full build.
kotlin.incremental=false
